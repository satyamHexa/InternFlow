name: CD – Deploy Intern Flow

on:
  push:
    branches: [main]

env:
  AZURE_WEBAPP_NAME_BACKEND:  internflow-backend
  AZURE_WEBAPP_NAME_FRONTEND: internflow-frontend
  AZURE_RESOURCE_GROUP:       internflow-rg

jobs:

  deploy-backend:
    name: Deploy Backend to Azure App Service
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push backend image
        run: |
          docker build backend/ -t ${{ secrets.ACR_LOGIN_SERVER }}/internflow-backend:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/internflow-backend:${{ github.sha }}

      - name: Deploy backend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME_BACKEND }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/internflow-backend:${{ github.sha }}

  deploy-frontend:
    name: Deploy Frontend (Static Files)
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
        run: npm ci && npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          output_location: dist
